<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b1724;height:100%}#gl{width:100vw;height:100vh;display:block}</style></head>
<body><canvas id="gl"></canvas>
<script src="three.min.js"></script>
<script src="hive_hmesh.js"></script>
<script>
const T=window.THREE, canvas=document.getElementById('gl');
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(2);
if(T.SRGBColorSpace!==undefined)renderer.outputColorSpace=T.SRGBColorSpace;
if(T.ACESFilmicToneMapping){renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;}
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(40,1,0.01,200);
scene.add(new T.HemisphereLight(0xeaf2ff,0x40302a,1.0));
let d=new T.DirectionalLight(0xfff3e6,1.2);d.position.set(5,9,8);scene.add(d);
let d2=new T.DirectionalLight(0xaecbff,0.5);d2.position.set(-7,-1,-5);scene.add(d2);
let rim=new T.DirectionalLight(0xffe9cf,0.6);rim.position.set(-4,5,-9);scene.add(rim);
const root=new T.Group();scene.add(root);
HiveHMesh.load(T,'anatomy/skin_body.hmesh').then(g=>{
 g.computeVertexNormals();
 let m=new T.MeshStandardMaterial({color:0xd2a07e,roughness:0.72,metalness:0.02,side:T.DoubleSide});m.envMapIntensity=0.4;
 root.add(new T.Mesh(g,m));
 let box=new T.Box3().setFromObject(root),c=new T.Vector3();box.getCenter(c);let s=new T.Vector3();box.getSize(s);
 let scale=7.5/Math.max(s.x,s.y,s.z);root.scale.setScalar(scale);root.position.set(-c.x*scale,-c.y*scale,-c.z*scale);
 window.__ready=1;document.title='READY';
}).catch(e=>{document.title='ERR '+e.message;});
camera.position.set(0,0,10);camera.lookAt(0,0,0);
function resize(){let w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}resize();
function loop(){renderer.render(scene,camera);requestAnimationFrame(loop);}loop();
window.__setrot=(x,y)=>{root.rotation.x=x;root.rotation.y=y;};
</script></body></html>
